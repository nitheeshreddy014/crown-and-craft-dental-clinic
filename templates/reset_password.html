<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset Password | Crown &amp; Craft Dental Clinic</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f8fafc,#ffffff);font-family:'Inter',sans-serif;padding:20px}
.card{background:rgba(255,255,255,.05);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:40px 36px;width:100%;max-width:440px;box-shadow:0 25px 60px rgba(0,0,0,.4)}
.logo{text-align:center;margin-bottom:24px;font-size:2.2rem}
h2{text-align:center;color:#0f172a;font-size:1.4rem;margin-bottom:6px}
.sub{text-align:center;color:rgba(255,255,255,.4);font-size:.85rem;margin-bottom:24px}
.fg{margin-bottom:16px}
.fg label{display:block;font-size:.8rem;font-weight:600;color:rgba(255,255,255,.55);margin-bottom:6px}
.iw{display:flex;align-items:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;overflow:hidden;transition:all .3s}
.iw:focus-within{border-color:#0d9488;box-shadow:0 0 0 3px rgba(13,148,136,.12)}
.iw input{flex:1;padding:12px;background:transparent;border:none;color:#0f172a;font-family:'Inter',sans-serif;font-size:.9rem;outline:none}
.iw input::placeholder{color:rgba(255,255,255,.25)}
.tpw{background:none;border:none;color:rgba(255,255,255,.4);cursor:pointer;padding:0 14px;font-size:1.1rem}
.msg{padding:11px 14px;border-radius:10px;font-size:.84rem;margin-bottom:16px;display:none;text-align:center}
.msg.show{display:block}
.err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:#4ade80}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#0d9488,#2dd4bf);border:none;border-radius:12px;color:#0f172a;font-size:.93rem;font-weight:700;cursor:pointer;transition:all .3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(13,148,136,.4)}
.btn:disabled{opacity:.7;cursor:not-allowed;transform:none}
.back{display:block;text-align:center;margin-top:18px;color:rgba(255,255,255,.4);text-decoration:none;font-size:.84rem}
.back:hover{color:#0d9488}
.str-bar{height:4px;background:rgba(255,255,255,.08);border-radius:4px;margin-top:8px;overflow:hidden}
.str-fill{height:100%;width:0;border-radius:4px;transition:width .3s,background .3s}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🔑</div>
  <h2>Set New Password</h2>
  <p class="sub">Enter your new password below</p>

  <div class="msg err" id="err-msg"></div>
  <div class="msg ok"  id="ok-msg"></div>

  <form id="reset-form">
    <input type="hidden" id="reset-token" value="{{ token }}">
    <div class="fg">
      <label>New Password</label>
      <div class="iw">
        <input type="password" id="pw" placeholder="Min 6 characters" required>
        <button type="button" class="tpw" data-t="pw">👁️</button>
      </div>
      <div class="str-bar"><div class="str-fill" id="str-fill"></div></div>
    </div>
    <div class="fg">
      <label>Confirm Password</label>
      <div class="iw">
        <input type="password" id="cpw" placeholder="Re-enter password" required>
        <button type="button" class="tpw" data-t="cpw">👁️</button>
      </div>
    </div>
    <button type="submit" class="btn" id="submit-btn">🔑 Update Password</button>
  </form>
  <a href="/login" class="back">← Back to Sign In</a>
</div>

<script>
document.querySelectorAll('.tpw').forEach(btn => {
  btn.addEventListener('click', () => {
    const inp = document.getElementById(btn.dataset.t);
    inp.type = inp.type === 'text' ? 'password' : 'text';
    btn.textContent = inp.type === 'text' ? '🙈' : '👁️';
  });
});

document.getElementById('pw').addEventListener('input', function() {
  const v = this.value; let s = 0;
  if (v.length >= 6) s += 25; if (v.length >= 10) s += 25;
  if (/[A-Z]/.test(v)) s += 25; if (/[0-9!@#$%]/.test(v)) s += 25;
  const fill = document.getElementById('str-fill');
  fill.style.width = s + '%';
  fill.style.background = s <= 25 ? '#ef4444' : s <= 50 ? '#f97316' : s <= 75 ? '#eab308' : '#22c55e';
});

document.getElementById('reset-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const err = document.getElementById('err-msg');
  const ok  = document.getElementById('ok-msg');
  const btn = document.getElementById('submit-btn');
  err.classList.remove('show'); ok.classList.remove('show');

  const token   = document.getElementById('reset-token').value;
  const pw      = document.getElementById('pw').value;
  const cpw     = document.getElementById('cpw').value;

  if (!token) { err.textContent = 'Invalid or missing reset token.'; err.classList.add('show'); return; }
  if (pw.length < 6) { err.textContent = 'Password must be at least 6 characters.'; err.classList.add('show'); return; }
  if (pw !== cpw)    { err.textContent = 'Passwords do not match.'; err.classList.add('show'); return; }

  btn.disabled = true; btn.textContent = 'Updating...';
  try {
    const res  = await fetch('/api/reset-password', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({token, password: pw, confirm_password: cpw})
    });
    const data = await res.json();
    if (data.success) {
      ok.textContent = '✅ ' + data.message;
      ok.classList.add('show');
      setTimeout(() => window.location.href = '/login', 2000);
    } else {
      err.textContent = data.message || 'Something went wrong.';
      err.classList.add('show');
      btn.disabled = false; btn.textContent = '🔑 Update Password';
    }
  } catch {
    err.textContent = 'Connection error. Please try again.';
    err.classList.add('show');
    btn.disabled = false; btn.textContent = '🔑 Update Password';
  }
});
</script>
</body>
</html>
